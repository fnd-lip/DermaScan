services:
  postgres:
    image: postgres:16
    container_name: dermascan_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: dermascan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dermascan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dermascan_network

  backend:
    build:
      context: ./backend
    container_name: dermascan_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://dermascan:${POSTGRES_PASSWORD}@postgres:5432/dermascan_db?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      ML_SERVICE_URL: http://ml-service:5001
    depends_on:
      - postgres
      - ml-service
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - dermascan_network

  ml-service:
    build:
      context: ./ml-service
    container_name: dermascan_ml_service_prod
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./ml-service/models:/app/models
    command: bentoml serve src.service:DermaScanService --host 0.0.0.0 --port 5001
    networks:
      - dermascan_network

  frontend:
    build:
      context: ./frontend
    container_name: dermascan_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - dermascan_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  dermascan_network:
    driver: bridge