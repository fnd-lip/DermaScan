services:
  postgres:
    image: postgres:16
    container_name: dermascan_postgres
    restart: always
    environment:
      POSTGRES_USER: dermascan
      POSTGRES_PASSWORD: dermascan123
      POSTGRES_DB: dermascan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: