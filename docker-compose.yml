services:
  postgres:
    image: postgres:16
    container_name: dermascan_postgres
    restart: always
    environment:
      POSTGRES_USER: dermascan
      POSTGRES_PASSWORD: dermascan123
      POSTGRES_DB: dermascan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml-service:
    build:
      context: ./ml-service
    container_name: dermascan_ml_service
    volumes:
      - ./ml-service:/app
    working_dir: /app
    command: python -c "print('ML service pronto')"

volumes:
  postgres_data: