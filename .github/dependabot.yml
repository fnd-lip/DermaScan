version: 2

updates:
  # Backend - Node.js
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      # Mantem os pacotes do Prisma juntos
      prisma:
        applies-to: version-updates
        patterns:
          - "prisma"
          - "@prisma/client"
          - "@prisma/adapter-pg"
        update-types:
          - "minor"
          - "patch"

      # Ferramentas de qualidade de codigo
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - "minor"
          - "patch"

  # Frontend - React
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      # Ferramentas de qualidade de codigo
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
        update-types:
          - "minor"
          - "patch"

      # Definicoes de tipos do TypeScript
      typescript-types:
        applies-to: version-updates
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  # Servico de IA - Python
  - package-ecosystem: "pip"
    directory: "/ml-service"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 2

    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

    groups:
      # Atualiza bibliotecas relacionadas ao OpenTelemetry juntas
      opentelemetry:
        applies-to: version-updates
        patterns:
          - "opentelemetry-*"
        update-types:
          - "minor"
          - "patch"
